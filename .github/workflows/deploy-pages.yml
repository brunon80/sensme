# Deploy the web shell to GitHub Pages (product-owner request 2026-11-25:
# reachable from other devices). The wasm package and TS contracts are
# gitignored generated artifacts, so CI regenerates them first.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml (AGENTS.md §3).
      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ts-rs `#[ts(export)]` writes contracts/generated/*.ts during tests.
      - name: Generate TS contracts
        run: cargo test -p moodwave-core

      - name: Build wasm package (web target)
        run: wasm-pack build crates/moodwave-wasm --target web --out-dir pkg

      - uses: pnpm/action-setup@v4 # version from package.json packageManager
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web app
        run: pnpm install --frozen-lockfile && pnpm --filter @moodwave/web build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
